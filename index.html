    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        alabaster: '#FAF9F6',
                        charcoal: '#2A2827',
                        sage: '#8A9A86',
                        'sage-light': '#E2E8E1',
                        sand: '#EAE5D9',
                        warmgray: '#8C857B',
                        blush: '#E8D3C8',

                    fontFamily: {

                    }

        }

    <style>
        body {
            background-color: #FAF9F6;
            color: #2A2827;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .font-serif { font-family: 'Playfair Display', serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #FAF9F6; }
        ::-webkit-scrollbar-thumb { background: #D1CDC4; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #8A9A86; }

        /* Laser Beam Scanning Animation */
        @keyframes scanBeam {
            0% { top: 0%; opacity: 0.8; }
            50% { top: 95%; opacity: 0.8; }
            100% { top: 0%; opacity: 0.8; }
        }
        .scan-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #8A9A86, #E8D3C8, #8A9A86, transparent);
            box-shadow: 0 0 12px #8A9A86, 0 0 20px #E8D3C8;
            animation: scanBeam 2.5s infinite ease-in-out;
        }
    </style>
</head>
